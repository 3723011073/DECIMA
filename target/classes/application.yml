spring:
  application:
    name: marketing-analytics-backend
  
  # Database Configuration
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  
  # Flyway Configuration (Database migrations)
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
  
server:
  port: 8080

# JWT Configuration
jwt:
  secret: your-secret-key-change-in-production-minimum-256-characters-long-key-value
  expiration: 86400000  # 24 hours in milliseconds
  refresh-expiration: 604800000  # 7 days in milliseconds

# ML Service Configuration
ml-service:
  url: http://localhost:5000
  endpoints:
    predict: /predict
    train: /train
    evaluate: /evaluate
    drift-detection: /drift-detection

# Logging Configuration
logging:
  level:
    root: INFO
    com.marketing.analytics: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/marketing-analytics.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
