spring:
  application:
    name: marketing-analytics-backend
  
  # Database Configuration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/marketing_analytics_db}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:root123}
    driver-class-name: org.postgresql.Driver
  
  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  # Flyway Configuration (Database migrations)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  
server:
  port: 8081

# JWT Configuration
jwt:
  secret: your-secret-key-change-in-production-minimum-256-characters-long-key-value
  expiration: 86400000  # 24 hours in milliseconds
  refresh-expiration: 604800000  # 7 days in milliseconds

# Required only when registering a SYSTEM_ADMIN account
registration:
  system-admin-key: ${SYSTEM_ADMIN_REGISTRATION_KEY:}

# ML Service Configuration
ml-service:
  url: http://localhost:5000
  endpoints:
    predict: /predict
    train: /train
    evaluate: /evaluate
    drift-detection: /drift-detection

# Logging Configuration
logging:
  level:
    root: INFO
    com.marketing.analytics: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/marketing-analytics.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
